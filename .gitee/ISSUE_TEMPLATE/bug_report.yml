name: 漏洞报告
description: 用于报告一个非安全漏洞。如果是安全漏洞，请看仓库/SECURITY.md
title: "[Bug] "

body:
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: v0.0.1-b1-prel
      description: 要写完整版本号，不写默认认为是最新版本
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: 详细描述
      description: 简明扼要地描述你遇到的问题。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 写明白进入...，点击...，做...动作，出现...错误
    validations:
      required: false

  - type: textarea
    id: behaviour
    attributes:
      label: 行为
      description: 写明白期望行为与实际行为
    validations:
      required: false
